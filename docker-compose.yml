version: '3.8'

services:

  ishtech-node-fastify-books-app:
    build: .
    container_name: ishtech_node_fastify_books_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: bookapp_dev_user
      DB_PASSWORD: bookapp_dev_pass
      DB_NAME: ishtech_dev_db
      DB_SSL: "false"
      LOG_LEVEL: info
      API_PREFIX: /api/v1
    depends_on:
      ishtech-node-fastify-books-postgres:
        condition: service_healthy
    networks:
      - ishtech-node-fastify-books-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT_LOCAL:-${SERVER_PORT:-8080}}/actuator/health"]
      start_period: 60s

  ishtech-node-fastify-books-postgres:
    image: postgres:18
    container_name: ishtech_node_fastify_books_postgres
    environment:
      - POSTGRES_DB=ishtech_dev_db
      - POSTGRES_USER=ishtech_dev_user
      - POSTGRES_PASSWORD=ishtech_dev_pass
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ishtech_node_fastify_books_postgres_data:/var/lib/postgresql/18/data
      - ./src/test/resources/db/init_db.sql:/docker-entrypoint-initdb.d/bookapp_dev_init_db.sql
    networks:
      - ishtech-node-fastify-books-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 45s

volumes:
  ishtech_node_fastify_books_postgres_data:

networks:
  ishtech-node-fastify-books-network:
    driver: bridge
